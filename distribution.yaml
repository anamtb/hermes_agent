name: hermes-commerce-agent
version: 0.3.0


description: "Controlled multi-channel commerce agent with Odoo as source of truth"


author: "Hermes Commerce Agent contributors"


hermes_requires: ">=0.14.0"


env_requires:
- name: ODOO_BASE_URL
  description: "Base URL de la instancia Odoo"
  required: true
- name: ODOO_API_KEY
  description: "API key de Odoo con permisos mínimos de comercio"
  required: true
- name: ODOO_ALLOW_PUBLISH
  description: "Habilita técnicamente la publicación Odoo; los gates siguen siendo obligatorios"
  required: false
  default: "false"
- name: HERMES_PRODUCT_IMAGE_DIR
  description: "Directorio local permitido para imágenes aportadas por el usuario"
  required: false
  default: ""
- name: GOOGLE_OAUTH_CLIENT_ID
  description: "Client ID OAuth de escritorio para Google Merchant"
  required: true
- name: GOOGLE_OAUTH_CLIENT_SECRET
  description: "Client secret OAuth de escritorio para Google Merchant"
  required: true
- name: GOOGLE_OAUTH_REFRESH_TOKEN
  description: "Refresh token OAuth para Google Merchant"
  required: true
- name: GOOGLE_MERCHANT_ACCOUNT_ID
  description: "Cuenta Merchant Center configurada por el instalador"
  required: true
- name: AMAZON_SP_API_CLIENT_ID
  description: "Placeholder para futura integración Amazon SP-API (scaffold no operativo)"
  required: false
  default: ""
- name: AMAZON_SP_API_CLIENT_SECRET
  description: "Placeholder secreto para futura integración Amazon SP-API"
  required: false
  default: ""
- name: AMAZON_SP_API_REFRESH_TOKEN
  description: "Placeholder secreto para futura integración Amazon SP-API"
  required: false
  default: ""
- name: AMAZON_SELLER_ID
  description: "Placeholder para el seller futuro; no se deduce ni hardcodea"
  required: false
  default: ""
- name: AMAZON_MARKETPLACE_ID
  description: "Placeholder para marketplace futuro; no se deduce ni hardcodea"
  required: false
  default: ""
- name: PCCOMPONENTES_MIRAKL_API_URL
  description: "Placeholder para URL verificada de la futura API Mirakl"
  required: false
  default: ""
- name: PCCOMPONENTES_MIRAKL_API_KEY
  description: "Placeholder secreto para futura integración PcComponentes"
  required: false
  default: ""
- name: PCCOMPONENTES_SHOP_ID
  description: "Placeholder para shop futuro; no se deduce ni hardcodea"
  required: false
  default: ""


distribution_owned:
- distribution.yaml
- pyproject.toml
- src/
- SOUL.md
- config.yaml
- mcp.json
- requirements.txt
- skills/
- knowledge/
- sandbox/
- mcp/
